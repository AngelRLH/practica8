<!doctype html> <!-- Define que es un documento HTML5 -->
<html lang="en"> <!-- Etiqueta raiz, lang indica idioma ingles -->

  <head>
    <!-- Configuracion de la pagina, no se ve -->
    <meta charset="UTF-8" /> <!-- Permite acentos y caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Responsive para celular -->
    <title>Practica 1</title> <!-- Titulo de la pestaña del navegador -->

    <style>
      /* Hoja de estilos CSS interna */
      body {
        font-family: arial; /* Tipo de fuente para toda la pagina */
        color: #e04612; /* Color de texto en hexadecimal - naranja/rojo del pizarron */
      }
    </style>
  </head>

  <body>
    <!-- Contenido visible de la pagina -->

    <h1 align="center">Tecnologico Campus Acapulco</h1>
    <!-- Encabezado principal H1, align=center lo centra -->

    <h2 align="right"><i>Ingenieria en Sistemas Computacionales</i></h2>
    <!-- Subtitulo H2 alineado a la derecha, <i> lo pone en cursiva -->

    <h3><b>Lopez Hernandez Angel Roman</b></h3>
    <!-- Subtitulo H3 con nombre, <b> lo pone en negritas -->

    23320895
    <!-- Matricula como texto plano -->

    <hr> 
    <!-- Linea horizontal de separacion, ahora si dentro del body -->
    
  </body>

</html> <!-- Cierre del documento HTML -->
